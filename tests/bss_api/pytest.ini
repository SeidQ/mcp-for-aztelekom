[pytest]
testpaths = .
addopts = -ra --strict-markers
markers =
    smoke: main happy-path checks per endpoint
    negative: invalid input must be rejected with 4xx, never 5xx
    security: authentication checks (need BSS_AUTH_HEADER)
    write: POST /v1/payment – creates data, needs BSS_ALLOW_WRITE=1
    performance: response time checks (BSS_MAX_MS)
    offline: runs without the API (swagger self-checks)
